name: BlessingCircle
options:
  bundleIdPrefix: app.manna-circle
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 98RU8TVC42
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.51.0
targets:
  BlessingCircle:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - LiveActivityWidget
          - NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.manna-circle.ios
        PRODUCT_MODULE_NAME: BlessingCircle
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - MannaLight
          - MannaDark
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: manna circle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: manna circle uses the microphone while you record a voice or video blessing.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: manna circle transcribes your spoken blessing into editable text.
        INFOPLIST_KEY_NSCameraUsageDescription: manna circle uses the camera when you choose to take a photo or record a video blessing.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: manna circle can import a photo or video you choose for your blessing.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: Configuration/BlessingCircle.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.app.blessingcircle.shared
    configFiles:
      Debug: Configuration/Development.xcconfig
      Release: Configuration/Production.xcconfig
    preBuildScripts:
      - name: Validate hosted Release configuration
        script: |
          "$SRCROOT/Scripts/validate-release-configuration.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: manna circle
        CFBundleName: manna circle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.manna-circle.ios
            CFBundleURLSchemes:
              - blessingcircle
        NSMicrophoneUsageDescription: manna circle uses the microphone while you record a voice or video blessing.
        NSSpeechRecognitionUsageDescription: manna circle transcribes your spoken blessing into editable text.
        NSCameraUsageDescription: manna circle uses the camera when you choose to take a photo or record a video blessing.
        NSPhotoLibraryUsageDescription: manna circle can import a photo or video you choose for your blessing.
        NSSupportsLiveActivities: true
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: BlessingCircleLiveActivity
        embed: true
      - target: BlessingCircleNotificationService
        embed: true
      - package: Supabase
    scheme:
      testTargets:
        - BlessingCircleTests
        - BlessingCircleUITests
  BlessingCircleLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LiveActivityWidget
      - path: Sources/Shared/PromptActivityAttributes.swift
      - path: Sources/Shared/BlessingWidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.manna-circle.ios.live-activity
        PRODUCT_NAME: BlessingCircleLiveActivity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Configuration/BlessingCircleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.blessingcircle.shared
    info:
      path: Configuration/Widget-Info.plist
      properties:
        CFBundleDisplayName: manna circle
        CFBundleName: manna circle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BlessingCircleNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.manna-circle.ios.notification-service
        PRODUCT_NAME: BlessingCircleNotificationService
        PRODUCT_MODULE_NAME: BlessingCircleNotificationService
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Configuration/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: manna circle notifications
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  BlessingCircleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BlessingCircle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.manna-circle.tests
        GENERATE_INFOPLIST_FILE: YES
  BlessingCircleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: BlessingCircle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.manna-circle.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BlessingCircle
